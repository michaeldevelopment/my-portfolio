# Netlify deployment config for this TanStack Start app.
# Nitro's `netlify` preset builds the SSR handler into .netlify/functions-internal
# and the static assets into dist/ (Netlify picks both up automatically).

[build]
  command = "pnpm run build:netlify"
  publish = "dist"

[build.environment]
  NODE_VERSION = "22"
  NITRO_PRESET = "netlify"

[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"
